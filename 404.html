<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Não Encontrada | FounderPage</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="fiveicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=14">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 24px;">
  <div style="max-width: 520px; width: 100%; background: var(--bg2); padding: 48px 32px; border-radius: 24px; border: 1px solid var(--border2); box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
    <a href="/" style="display: inline-block; margin-bottom: 24px;">
      <img src="logo.png" alt="FounderPage" style="height: 42px; width: auto;">
    </a>
    <h1 style="font-family: var(--ff-title); font-size: 4rem; color: var(--gold); margin-bottom: 12px; font-weight: 700;">404</h1>
    <h2 style="font-family: var(--ff-title); font-size: 1.5rem; color: var(--white); margin-bottom: 16px;">Página não encontrada</h2>
    <p style="color: var(--muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 32px;">
      A página que você está procurando pode ter sido movida, alterada ou não existe mais.
    </p>
    <a href="/" class="btn btn-gold" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
      VOLTAR PARA O INÍCIO &rarr;
    </a>
  </div>
</body>
</html>
